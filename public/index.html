<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LocalFlix</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="top">
    <a href="#/" class="logo">Local<b>Flix</b></a>
    <nav>
      <a href="#/" data-nav="">Inicio</a>
      <a href="#/series" data-nav="series">Series</a>
      <a href="#/movies" data-nav="movies">Películas</a>
    </nav>
    <form id="searchForm" class="search" role="search">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
      <input id="searchInput" type="search" placeholder="Buscar" autocomplete="off">
    </form>
    <a href="#/folders" class="gear" data-nav="folders" title="Carpetas de la biblioteca" aria-label="Carpetas de la biblioteca">
      <svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2Z"/></svg>
    </a>
  </header>

  <main id="app"></main>

  <div id="player" hidden>
    <video id="video" playsinline preload="auto"></video>
    <div id="subtext" class="subtext"></div>
    <div id="castNote" class="cast-note" hidden><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2ZM1 18v3h3a3 3 0 0 0-3-3Zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7Zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10Z"/></svg><span id="castName">Transmitiendo a la TV</span></div>
    <div id="spinner" class="spinner" hidden></div>
    <div id="plui" class="pl-ui">
      <div class="pl-top">
        <button id="plBack" class="icon" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
        <div class="pl-title"><b id="plTitle"></b><span id="plSub"></span></div>
      </div>
      <button id="plBig" class="pl-big" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="pl-bottom">
        <div id="seek" class="seek" tabindex="0" role="slider" aria-label="Posición">
          <div class="track"><div id="seekFill" class="fill"></div></div>
          <div id="seekKnob" class="knob"></div>
          <div id="seekTip" class="tip" hidden></div>
        </div>
        <div class="pl-row">
          <button id="plPlay" class="icon" aria-label="Reproducir/Pausa"></button>
          <button id="plRew" class="icon" aria-label="Atrás 10 segundos"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-weight="700">10</text></svg></button>
          <button id="plFwd" class="icon" aria-label="Adelante 10 segundos"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8Z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-weight="700">10</text></svg></button>
          <span id="plTime" class="time">0:00 / 0:00</span>
          <span class="grow"></span>
          <span id="plMode" class="badge"></span>
          <button id="plNext" class="icon" aria-label="Siguiente episodio" hidden><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
          <button id="plCast" class="icon" aria-label="Transmitir a la TV" hidden><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2ZM1 18v3h3a3 3 0 0 0-3-3Zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7Zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10Z"/></svg></button>
          <button id="plSettings" class="icon" aria-label="Audio y subtítulos"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 14H4V6h16v12ZM6 10h2v2H6v-2Zm0 4h8v2H6v-2Zm10 0h2v2h-2v-2Zm-6-4h8v2h-8v-2Z"/></svg></button>
          <button id="plFs" class="icon" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3Zm-2-4h2V7h3V5H5v5Zm12 7h-3v2h5v-5h-2v3ZM14 5v2h3v3h2V5h-5Z"/></svg></button>
        </div>
      </div>
      <div id="plPanel" class="pl-panel" hidden></div>
    </div>
    <div id="nextUp" class="next-up" hidden>
      <div class="nu-label">Siguiente episodio en <span id="nuCount">10</span></div>
      <div id="nuTitle" class="nu-title"></div>
      <div class="nu-actions">
        <button id="nuPlay" class="btn primary">Reproducir ahora</button>
        <button id="nuCancel" class="btn">Cancelar</button>
      </div>
    </div>
    <div id="plError" class="pl-error" hidden></div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
